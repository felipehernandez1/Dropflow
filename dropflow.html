<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dropflow v4.0 — Executive OS</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500&family=Outfit:wght@300;400;800&family=Birthstone&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020508; --panel: rgba(6, 12, 22, 0.9); --gold: #ff9d00;
            --cyan: #00f2ff; --red: #ff4d4d; --text: #e0f0ff;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        aside { width: 260px; background: rgba(4, 8, 15, 0.98); border-right: 1px solid rgba(255,157,0,0.2); padding: 25px; display: flex; flex-direction: column; }
        .nav-link { padding: 12px; margin: 5px 0; cursor: pointer; border-radius: 8px; transition: 0.3s; color: #608095; display: flex; align-items: center; gap: 10px; }
        .nav-link:hover, .nav-link.active { background: rgba(255, 157, 0, 0.1); color: var(--gold); border-left: 3px solid var(--gold); }

        /* Main Content */
        main { flex: 1; padding: 40px; overflow-y: auto; background-image: radial-gradient(circle at 50% 0%, #1a1500 0%, var(--bg) 70%); }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Estilo Executive */
        .exec-card { background: var(--panel); border: 1px solid rgba(255,157,0,0.1); border-radius: 15px; padding: 20px; backdrop-filter: blur(10px); }
        .sem-green { border-left: 4px solid var(--cyan); box-shadow: -5px 0 15px rgba(0,242,255,0.1); }
        .sem-yellow { border-left: 4px solid var(--gold); box-shadow: -5px 0 15px rgba(255,157,0,0.1); }
        .sem-red { border-left: 4px solid var(--red); box-shadow: -5px 0 15px rgba(255,77,77,0.1); }

        /* Gauge Central */
        .gauge-container { position: relative; width: 300px; height: 300px; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
        .gauge-title { font-family: 'Birthstone', cursive; font-size: 3.5rem; color: var(--gold); position: absolute; z-index: 2; }
        
        table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono'; font-size: 0.8rem; margin-top: 15px; }
        th { color: var(--gold); text-align: left; padding: 10px; border-bottom: 1px solid rgba(255,157,0,0.2); }
        td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<aside>
    <h2 style="color:var(--gold)">DROPFLOW</h2>
    <div class="nav-link active" onclick="navegar('dashboard')">Dashboard</div>
    <div class="nav-link" onclick="navegar('pedidos')">Pedidos (Dropi)</div>
    <div class="nav-link" onclick="navegar('meta')">Meta Ads</div>
    <div class="nav-link" onclick="navegar('config')">Configuración</div>
</aside>

<main>
    <!-- DASHBOARD -->
    <div id="section-dashboard" class="section active">
        <div class="gauge-container">
            <div class="gauge-title">Executive</div>
            <svg width="300" height="300"><circle cx="150" cy="150" r="130" fill="none" stroke="rgba(255,157,0,0.1)" stroke-width="8"/><circle cx="150" cy="150" r="130" fill="none" stroke="var(--gold)" stroke-width="8" stroke-dasharray="816" stroke-dashoffset="200" stroke-linecap="round"/></svg>
        </div>
        <div id="insights-container" class="exec-card sem-yellow" style="margin-top:20px;">
            <small style="color:var(--gold)">AI INSIGHTS</small>
            <p id="insight-text">Cargando análisis de métricas...</p>
        </div>
    </div>

    <!-- CONFIGURACIÓN (Semaforización) -->
    <div id="section-config" class="section">
        <h1>Configuración de Sistema</h1>
        <div class="exec-card">
            <h3>Límites de Semáforo</h3>
            <label>ROAS Mínimo (Rojo): <input type="number" id="limit-roas" value="2.0"></label><br><br>
            <label>CPA Máximo (Rojo): <input type="number" id="limit-cpa" value="8000"></label>
            <button onclick="saveConfig()" style="background:var(--gold); border:none; padding:10px; margin-top:10px; cursor:pointer;">Guardar Cambios</button>
        </div>
    </div>

    <!-- PEDIDOS -->
    <div id="section-pedidos" class="section">
        <h1>Carga Dropi (Excel/CSV)</h1>
        <input type="file" id="fileInput" onchange="handleFileUpload(event)" class="exec-card">
        <table id="table-pedidos"><thead><tr><th>Fecha</th><th>Cliente</th><th>Estado</th><th>Total</th></tr></thead><tbody></tbody></table>
    </div>
</main>

<script>
    // LÓGICA DE NAVEGACIÓN
    function navegar(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById('section-' + id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // LÓGICA DE SEMÁFOROS E INSIGHTS
    function updateSemaforos(roas, cpa) {
        const limitRoas = parseFloat(document.getElementById('limit-roas').value);
        const card = document.getElementById('insights-container');
        const text = document.getElementById('insight-text');

        if (roas < limitRoas) {
            card.className = "exec-card sem-red";
            text.innerText = "Alerta: ROAS por debajo del límite. Revisa tus creativos urgentemente.";
        } else {
            card.className = "exec-card sem-green";
            text.innerText = "Rendimiento óptimo. Las campañas están escalando correctamente.";
        }
    }

    // PROCESAMIENTO DE ARCHIVOS (DROPI)
    function handleFileUpload(event) {
        const file = event.target.files[0];
        // Aquí iría tu lógica de PapaParse o XLSX original
        console.log("Procesando archivo:", file.name);
        alert("Archivo " + file.name + " cargado con éxito. Procesando datos...");
    }

    function saveConfig() {
        alert("Configuración guardada en dropflow.db");
    }
</script>

</body>
</html>
